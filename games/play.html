<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>正在游戏 · Genav-Game</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#f3f4f6;--surface:#fff;--line:#090a0d;--ink:#090a0d;--signal:#ff4538;--highlight:#ffe100;--hard:3px 3px 0 var(--line)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;font-weight:600}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--surface);border-bottom:2px solid var(--line)}
.logo{width:34px;height:34px;filter:drop-shadow(2px 2px 0 var(--line))}
.back{display:flex;align-items:center;gap:6px;padding:8px 13px;border:2px solid var(--line);border-radius:4px;
  background:var(--surface);cursor:pointer;font-weight:800;font-size:14px;box-shadow:var(--hard);color:var(--ink)}
.back:hover{transform:translate(-1px,-1px)}
.title{font-weight:900;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{background:var(--highlight);color:#090a0d;border:2px solid var(--line);border-radius:4px;padding:8px 14px;
  font-weight:900;font-size:13.5px;cursor:pointer;box-shadow:var(--hard)}
.brandmark{font-weight:900;font-size:15px;letter-spacing:-.3px}
.brandmark span{color:var(--signal)}
#stage{position:absolute;top:56px;left:0;right:0;bottom:0;background:#000}
#stage iframe{width:100%;height:100%;border:0;display:block}
.err{display:flex;height:100%;align-items:center;justify-content:center;color:#9aa7ba;font-size:16px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="bar">
  <img class="logo" src="logo.png" alt="">
  <button class="back" onclick="history.length>1?history.back():location.href='./'">← 返回</button>
  <div class="title" id="title">游戏加载中…</div>
  <div class="brandmark">Genav<span>-Game</span></div>
  <button class="fs" id="fs">⛶ 全屏</button>
</div>
<div id="stage"></div>
<script>
const p=new URLSearchParams(location.search);
const id=p.get("id"), t=p.get("t")||"小游戏";
document.title=t+" · Genav-Game";
document.getElementById("title").textContent=t;
const stage=document.getElementById("stage");
if(!id){
  stage.innerHTML='<div class="err">缺少游戏参数</div>';
}else{
  const f=document.createElement("iframe");
  f.src="https://html5.gamemonetize.co/"+encodeURIComponent(id)+"/";
  f.allowFullscreen=true; f.setAttribute("scrolling","no"); f.setAttribute("frameborder","0");
  f.setAttribute("allow","autoplay; fullscreen; gamepad; accelerometer; gyroscope; magnetometer; xr-spatial-tracking");
  stage.appendChild(f);
}
document.getElementById("fs").onclick=()=>{
  const el=stage;
  if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
  else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}
};
</script>
</body>
</html>
