<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>正在游戏 · 游戏厅</title>
<style>
:root{--bg:#0f1218;--line:#26303f;--txt:#e8edf5;--sub:#9aa7ba;--accent:#5b8cff;--accent2:#8b5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden}
.bar{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:rgba(15,18,24,.9);border-bottom:1px solid var(--line)}
.back{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14px;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);cursor:pointer;background:transparent;white-space:nowrap}
.back:hover{color:var(--txt);border-color:#33415a}
.title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fs{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:9px;
  padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.fs:active{transform:scale(.97)}
#stage{position:absolute;top:52px;left:0;right:0;bottom:0;background:#000}
#stage iframe{width:100%;height:100%;border:0;display:block}
.err{display:flex;height:100%;align-items:center;justify-content:center;color:var(--sub);font-size:16px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="bar">
  <button class="back" onclick="history.length>1?history.back():location.href='/games/'">← 返回</button>
  <div class="title" id="title">游戏加载中…</div>
  <button class="fs" id="fs">⛶ 全屏</button>
</div>
<div id="stage"></div>
<script>
const p=new URLSearchParams(location.search);
const id=p.get("id"), t=p.get("t")||"小游戏";
document.title=t+" · 游戏厅";
document.getElementById("title").textContent=t;
const stage=document.getElementById("stage");

if(!id){
  stage.innerHTML='<div class="err">缺少游戏参数</div>';
}else{
  // GameDistribution 官方推荐：附带 gd_sdk_referrer_url = 当前游戏页真实地址
  const src=`https://html5.gamedistribution.com/${encodeURIComponent(id)}/?gd_sdk_referrer_url=${encodeURIComponent(location.href)}`;
  const f=document.createElement("iframe");
  f.src=src; f.allowFullscreen=true; f.setAttribute("scrolling","no"); f.setAttribute("frameborder","0");
  f.setAttribute("allow","autoplay; fullscreen; gamepad; accelerometer; gyroscope; magnetometer; xr-spatial-tracking");
  stage.appendChild(f);
}

document.getElementById("fs").onclick=()=>{
  const el=stage;
  if(!document.fullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
  }else{
    (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
  }
};
</script>
</body>
</html>
