<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>游戏厅 · Genav</title>
<meta name="description" content="genav 在线小游戏厅，数千款 HTML5 小游戏免安装即点即玩。">
<link rel="preconnect" href="https://img.gamedistribution.com">
<style>
:root{
  --bg:#0f1218; --bg2:#161b24; --card:#1b2130; --line:#26303f;
  --txt:#e8edf5; --sub:#9aa7ba; --accent:#5b8cff; --accent2:#8b5cff;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -200px,#1a2338 0%,var(--bg) 55%) fixed;
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px}
/* header */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(15,18,24,.72);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.3px;white-space:nowrap}
.logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:15px}
.search{flex:1;position:relative;max-width:520px}
.search input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);padding:0 14px 0 40px;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px}
.random{height:42px;padding:0 16px;border-radius:11px;border:0;cursor:pointer;font-weight:700;font-size:14px;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));white-space:nowrap;display:flex;align-items:center;gap:6px}
.random:active{transform:scale(.97)}
/* hero/stats */
.hero{padding:22px 0 6px}
.hero h1{margin:0 0 6px;font-size:22px}
.hero p{margin:0;color:var(--sub);font-size:14px}
.hero .stat{color:var(--accent);font-weight:700}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);
  color:var(--sub);font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.15s}
.chip:hover{color:var(--txt);border-color:#33415a}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding:8px 0 40px}
@media(max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}}
.card{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card);
  border:1px solid var(--line);cursor:pointer;transition:transform .16s,box-shadow .16s;aspect-ratio:4/3}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.45);border-color:#3a4a68}
.card .thumb{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg2)}
.card .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,15,.92) 0%,rgba(8,10,15,.15) 45%,transparent 70%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:10px 11px}
.card .tt{font-size:13.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 6px rgba(0,0,0,.7)}
.card .cat{font-size:11px;color:#b9c6db;margin-top:3px}
.card .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;
  width:46px;height:46px;border-radius:50%;background:rgba(91,140,255,.92);display:grid;place-items:center;
  font-size:18px;transition:.16s;color:#fff}
.card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* states */
.msg{text-align:center;color:var(--sub);padding:50px 0;font-size:15px}
.loading{text-align:center;padding:34px;color:var(--sub)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;text-align:center;padding:18px;line-height:1.7}
footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <a class="logo" href="/"><span class="dot">🎮</span>游戏厅</a>
    <div class="search">
      <span class="ic">🔍</span>
      <input id="q" type="search" placeholder="搜索游戏名 / 分类 / 标签…" autocomplete="off">
    </div>
    <button class="random" id="rand">🎲 随机</button>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1>免安装 · 即点即玩</h1>
    <p>已收录 <span class="stat" id="total">…</span> 款 HTML5 小游戏，加载中…</p>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="loading" id="more"><span class="spin"></span></div>
</main>

<footer>
  游戏内容由 <a href="https://gamedistribution.com" target="_blank" rel="noopener">GameDistribution</a> 提供并与版权方授权合作。<br>
  本页仅做导航与嵌入，游戏版权归各自作者所有。
</footer>

<script>
const $=s=>document.querySelector(s);
const grid=$("#grid"), chips=$("#chips"), moreEl=$("#more");
let ALL=[], view=[], shown=0, curCat="全部", PAGE=140;

function norm(g){
  const id=g.id||g.i, t=g.title||g.t||"未命名",
        m=g.img||g.m||("https://img.gamedistribution.com/"+id+"-512x384.jpg"),
        cats=(g.cat||g.c||[]), tags=(g.tags||g.tg||[]);
  return {id,t,m,cats,tags,
    hay:(t+" "+cats.join(" ")+" "+tags.join(" ")).toLowerCase()};
}

async function boot(){
  try{
    const r=await fetch("/games/games.json",{cache:"force-cache"});
    if(!r.ok) throw 0;
    ALL=(await r.json()).map(norm);
  }catch(e){
    grid.innerHTML='<div class="msg">游戏数据加载失败，请刷新重试</div>';moreEl.style.display="none";return;
  }
  $("#total").textContent=ALL.length.toLocaleString();
  buildChips(); apply();
}

function buildChips(){
  const cnt={};
  ALL.forEach(g=>g.cats.forEach(c=>cnt[c]=(cnt[c]||0)+1));
  const cats=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,16);
  const list=["全部",...cats];
  chips.innerHTML=list.map((c,i)=>`<div class="chip${i===0?' on':''}" data-c="${c}">${c}</div>`).join("");
  chips.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
    chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    el.classList.add("on");curCat=el.dataset.c;
    apply();window.scrollTo({top:0,behavior:"smooth"});
  });
}

function apply(){
  const q=$("#q").value.trim().toLowerCase();
  view=ALL.filter(g=>{
    if(curCat!=="全部" && !g.cats.includes(curCat)) return false;
    if(q && !g.hay.includes(q)) return false;
    return true;
  });
  grid.innerHTML="";shown=0;
  moreEl.style.display=view.length?"block":"none";
  if(!view.length){grid.innerHTML='<div class="msg">没有找到相关游戏 🕹️</div>';moreEl.style.display="none";return;}
  renderMore();
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function card(g){
  const cat=g.cats[0]||"";
  const el=document.createElement("a");
  el.className="card";
  el.href=`/games/play.html?id=${encodeURIComponent(g.id)}&t=${encodeURIComponent(g.t)}`;
  el.innerHTML=`<img class="thumb" loading="lazy" src="${esc(g.m)}" alt="${esc(g.t)}"
      onerror="this.style.opacity='.25'">
    <div class="ov"><div class="tt">${esc(g.t)}</div><div class="cat">${esc(cat)}</div></div>
    <div class="play">▶</div>`;
  return el;
}

function renderMore(){
  const frag=document.createDocumentFragment();
  const end=Math.min(shown+PAGE,view.length);
  for(let i=shown;i<end;i++) frag.appendChild(card(view[i]));
  grid.appendChild(frag);shown=end;
  moreEl.style.display=shown<view.length?"block":"none";
}

let qTimer;
$("#q").addEventListener("input",()=>{clearTimeout(qTimer);qTimer=setTimeout(apply,180);});
$("#rand").onclick=()=>{
  if(!ALL.length)return;
  const g=ALL[Math.floor(Math.random()*ALL.length)];
  location.href=`/games/play.html?id=${encodeURIComponent(g.id)}&t=${encodeURIComponent(g.t)}`;
};
// infinite scroll
new IntersectionObserver(es=>{if(es[0].isIntersecting && shown<view.length) renderMore();},{rootMargin:"600px"})
  .observe(moreEl);

boot();
</script>
</body>
</html>
