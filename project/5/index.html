<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻象星域 — 探索无限图像宇宙</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf9f7;--card:#ffffff;--text:#1a1a1a;--text-secondary:#6b6b6b;
  --accent:#d97757;--accent-light:#f0e6e0;--accent-dark:#c2574a;
  --border:#e5e5e5;--shadow:0 2px 20px rgba(0,0,0,0.06);
  --shadow-hover:0 8px 40px rgba(0,0,0,0.12);
  --gradient:linear-gradient(135deg,#d97757 0%,#c2574a 50%,#a84832 100%);
  --radius:20px;--radius-sm:12px;--radius-pill:50px;
  --transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  --star-color:rgba(217,119,87,0.6);
}
[data-theme="dark"]{
  --bg:#0f0f1a;--card:#1a1a2e;--text:#e8e6e3;--text-secondary:#9ca3af;
  --border:#2a2a3e;--shadow:0 2px 20px rgba(0,0,0,0.3);
  --shadow-hover:0 8px 40px rgba(0,0,0,0.5);
  --star-color:rgba(217,119,87,0.4);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100vh}

/* Starfield canvas */
#starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* Scroll progress */
.scroll-progress{position:fixed;top:0;left:0;height:3px;background:var(--gradient);z-index:1000;transition:width 0.1s}

/* Top bar */
.top-bar{position:fixed;top:12px;right:20px;z-index:100;display:flex;gap:10px;align-items:center}
.top-bar button{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-pill);padding:8px 16px;font-size:0.85rem;color:var(--text);cursor:pointer;transition:var(--transition);font-family:inherit;display:flex;align-items:center;gap:6px}
.top-bar button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.top-bar .icon-btn{padding:8px 12px;font-size:1.1rem}

/* Hero */
.hero{position:relative;z-index:1;min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 20px 60px}
.hero h1{font-size:3.5rem;font-weight:800;letter-spacing:-2px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;animation:fadeIn 0.8s ease}
.hero p{font-size:1.2rem;color:var(--text-secondary);animation:fadeIn 0.8s ease 0.2s both}
.hero .stats{margin-top:20px;display:flex;gap:24px;font-size:0.9rem;color:var(--text-secondary);animation:fadeIn 0.8s ease 0.4s both}
.hero .stats span{display:flex;align-items:center;gap:6px}
.hero .stats .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* Category pills */
.categories{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.categories-inner{max-width:1200px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px 0}
.categories-inner::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;padding:8px 18px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:0.85rem;cursor:pointer;transition:var(--transition);font-family:inherit;white-space:nowrap}
.cat-pill:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.cat-pill.active{background:var(--gradient);color:#fff;border-color:transparent}

/* Search bar */
.search-bar{max-width:1200px;margin:20px auto 0;padding:0 20px;position:relative;z-index:1}
.search-bar input{width:100%;padding:14px 20px 14px 48px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:0.95rem;font-family:inherit;transition:var(--transition);outline:none}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,0.15)}
.search-bar .search-icon{position:absolute;left:36px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:1.1rem;pointer-events:none}

/* Gallery */
.gallery-wrap{max-width:1200px;margin:0 auto;padding:20px 20px 60px;position:relative;z-index:1}
.gallery-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:0.9rem;color:var(--text-secondary)}
.masonry{columns:3;column-gap:16px}
.masonry .item{break-inside:avoid;margin-bottom:16px;border-radius:var(--radius);overflow:hidden;position:relative;cursor:pointer;transition:var(--transition);opacity:0;transform:translateY(20px)}
.masonry .item.visible{opacity:1;transform:translateY(0)}
.masonry .item:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.masonry .item img{width:100%;display:block;border-radius:var(--radius);transition:var(--transition)}
.masonry .item:hover img{transform:scale(1.02)}
.masonry .item .overlay{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,0.6));border-radius:0 0 var(--radius) var(--radius);display:flex;justify-content:space-between;align-items:center;opacity:0;transition:var(--transition)}
.masonry .item:hover .overlay{opacity:1}
.masonry .item .overlay .actions{display:flex;gap:8px}
.masonry .item .overlay .actions button{background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:36px;height:36px;color:#fff;cursor:pointer;font-size:1rem;transition:var(--transition);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.masonry .item .overlay .actions button:hover{background:var(--accent)}
.masonry .item .overlay .actions button.fav-active{color:#ff6b6b;background:rgba(255,255,255,0.3)}
.masonry .item .cat-tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.5);color:#fff;padding:4px 10px;border-radius:var(--radius-pill);font-size:0.75rem;backdrop-filter:blur(8px);opacity:0;transition:var(--transition)}
.masonry .item:hover .cat-tag{opacity:1}

/* Skeleton */
.skeleton{background:var(--border);border-radius:var(--radius);animation:pulse 1.5s infinite}
.skeleton-item{break-inside:avoid;margin-bottom:16px}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:0.3}}

/* Lightbox */
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(20px)}
.lightbox.active{display:flex}
.lightbox .lb-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;z-index:10;opacity:0.7;transition:var(--transition)}
.lightbox .lb-close:hover{opacity:1;transform:scale(1.1)}
.lightbox .lb-img{max-width:90vw;max-height:85vh;border-radius:var(--radius);object-fit:contain;transition:opacity 0.3s}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:2rem;cursor:pointer;width:50px;height:50px;border-radius:50%;transition:var(--transition);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.lightbox .lb-nav:hover{background:var(--accent)}
.lightbox .lb-prev{left:20px}
.lightbox .lb-next{right:20px}
.lightbox .lb-actions{position:absolute;bottom:24px;display:flex;gap:12px}
.lightbox .lb-actions button{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:10px 20px;border-radius:var(--radius-pill);cursor:pointer;font-size:0.9rem;transition:var(--transition);font-family:inherit;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.lightbox .lb-actions button:hover{background:var(--accent)}
.lightbox .lb-counter{position:absolute;top:24px;left:24px;color:rgba(255,255,255,0.7);font-size:0.9rem}
.lightbox .lb-cat{position:absolute;top:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:0.85rem}

/* Slideshow indicator */
.slideshow-badge{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:var(--radius-pill);font-size:0.85rem;z-index:210;display:none;align-items:center;gap:8px}
.slideshow-badge.active{display:flex}

/* Favorites panel */
.fav-panel{position:fixed;top:0;right:-400px;width:380px;height:100%;background:var(--card);border-left:1px solid var(--border);z-index:150;transition:right 0.4s cubic-bezier(0.25,0.46,0.45,0.94);overflow-y:auto;box-shadow:-4px 0 30px rgba(0,0,0,0.1)}
.fav-panel.open{right:0}
.fav-panel .fav-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:5}
.fav-panel .fav-header h3{font-size:1.1rem;font-weight:700}
.fav-panel .fav-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text)}
.fav-panel .fav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:16px}
.fav-panel .fav-grid .fav-item{border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1}
.fav-panel .fav-grid .fav-item img{width:100%;height:100%;object-fit:cover}
.fav-panel .fav-grid .fav-item .fav-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.5);border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:0.75rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:var(--transition)}
.fav-panel .fav-grid .fav-item:hover .fav-remove{opacity:1}
.fav-panel .fav-empty{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:0.9rem}

/* Back to top */
.back-top{position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:14px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;transform:translateY(20px);transition:var(--transition);box-shadow:0 4px 15px rgba(217,119,87,0.4)}
.back-top.visible{opacity:1;transform:translateY(0)}
.back-top:hover{transform:translateY(-3px);box-shadow:0 6px 25px rgba(217,119,87,0.5)}

/* Loading spinner */
.loading-bar{text-align:center;padding:30px;color:var(--text-secondary);font-size:0.9rem}
.loading-bar .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.footer{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:0.85rem;border-top:1px solid var(--border);position:relative;z-index:1}
.footer a{color:var(--accent);text-decoration:none}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:768px){
  .masonry{columns:2}
  .hero h1{font-size:2.5rem}
  .hero{min-height:40vh;padding:80px 16px 40px}
  .categories{padding:10px 12px}
  .cat-pill{padding:6px 14px;font-size:0.8rem}
  .fav-panel{width:100%;right:-100%}
  .lightbox .lb-nav{width:40px;height:40px;font-size:1.5rem}
  .lightbox .lb-prev{left:10px}
  .lightbox .lb-next{right:10px}
}
@media(max-width:480px){
  .masonry{columns:1}
  .hero h1{font-size:2rem}
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="scroll-progress" id="scrollProgress"></div>

<div class="top-bar">
  <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
  <button id="favToggle" title="收藏夹">♡ 收藏</button>
  <button id="randomBtn" title="随机切换">🎲 随机</button>
</div>

<section class="hero">
  <h1>✦ 幻象星域 ✦</h1>
  <p>探索无限图像宇宙</p>
  <div class="stats">
    <span><i class="dot"></i> <span id="totalCategories">22</span> 个分类</span>
    <span><i class="dot"></i> <span id="totalLoaded">0</span> 张图片已加载</span>
    <span><i class="dot"></i> <span id="favCount">0</span> 张已收藏</span>
  </div>
</section>

<nav class="categories">
  <div class="categories-inner" id="catBar"></div>
</nav>

<div class="search-bar">
  <span class="search-icon">🔍</span>
  <input type="text" id="searchInput" placeholder="搜索图片...">
</div>

<div class="gallery-wrap">
  <div class="gallery-info">
    <span id="galleryCount">加载中...</span>
    <span id="currentCatLabel"></span>
  </div>
  <div class="masonry" id="gallery"></div>
  <div class="loading-bar" id="loadingBar" style="display:none">
    <span class="spinner"></span> 加载更多图片中...
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <span class="lb-counter" id="lbCounter"></span>
  <span class="lb-cat" id="lbCat"></span>
  <img class="lb-img" id="lbImg" src="" alt="">
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-actions">
    <button id="lbDownload">⬇ 下载</button>
    <button id="lbFav">♡ 收藏</button>
    <button id="lbSlideshow">▶ 幻灯片</button>
  </div>
</div>

<div class="slideshow-badge" id="slideshowBadge">▶ 幻灯片播放中 — 按 Space 暂停</div>

<div class="fav-panel" id="favPanel">
  <div class="fav-header">
    <h3>♡ 我的收藏</h3>
    <button class="fav-close" id="favClose">✕</button>
  </div>
  <div class="fav-grid" id="favGrid"></div>
</div>

<button class="back-top" id="backTop" title="回到顶部">↑</button>

<footer class="footer">
  <p>幻象星域 — 图片来自互联网公开API · <a href="https://genav.cn">返回博客</a></p>
</footer>

<script>
// ===== CONFIG =====
const CATEGORIES = [
  {name:'全部',icon:'✦',apis:[]},
  {name:'二次元',icon:'🌸',apis:['https://www.dmoe.cc/random.php','https://api.mtyqx.cn/api/random.php']},
  {name:'原神',icon:'⚔️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=原神']},
  {name:'星穹铁道',icon:'🚂',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=星穹铁道']},
  {name:'鬼灭之刃',icon:'🗡️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=鬼灭之刃']},
  {name:'火影忍者',icon:'🍥',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=火影忍者']},
  {name:'海贼王',icon:'🏴‍☠️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=海贼王']},
  {name:'刀剑神域',icon:'⚔',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=刀剑神域']},
  {name:'咒术回战',icon:'👁️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=咒术回战']},
  {name:'进击的巨人',icon:'🏔️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=进击的巨人']},
  {name:'Fate',icon:'🔮',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=Fate']},
  {name:'赛马娘',icon:'🏇',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=赛马娘']},
  {name:'东方Project',icon:'🌙',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=东方project']},
  {name:'明日方舟',icon:'🛡️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=明日方舟']},
  {name:'宫崎骏',icon:'🎬',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=宫崎骏']},
  {name:'风景',icon:'🏞️',apis:['https://t.alcy.cc/fj/','https://api.r10086.com/樱道随机图片api接口.php?图片系列=风景系列1']},
  {name:'壁纸',icon:'🖼️',apis:['https://api.elaina.cat/random/pc','https://t.alcy.cc/pc/']},
  {name:'Pixiv',icon:'🎨',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=P站系列1']},
  {name:'CG艺术',icon:'🖌️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=CG系列1']},
  {name:'综合',icon:'🌈',apis:['https://api.vsuy.cn/api/api.php']},
  {name:'电锯人',icon:'⛓️',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=电锯人']},
  {name:'物语系列',icon:'📖',apis:['https://api.r10086.com/樱道随机图片api接口.php?图片系列=物语系列']},
];

const BATCH_SIZE = 8;
const LOAD_THRESHOLD = 600;

// ===== STATE =====
let currentCat = 0;
let allImages = []; // {url, cat, id}
let displayedImages = [];
let lightboxIndex = -1;
let favorites = JSON.parse(localStorage.getItem('phantom_favs')||'[]');
let slideshowTimer = null;
let isDark = localStorage.getItem('phantom_dark')==='true';
let isLoading = false;
let searchQuery = '';
let observer = null;

// ===== INIT =====
function init(){
  applyTheme();
  buildCatBar();
  updateFavCount();
  setupEvents();
  startStarfield();
  setupObserver();
  loadImages();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  document.getElementById('themeToggle').textContent=isDark?'☀️':'🌙';
}

function buildCatBar(){
  const bar=document.getElementById('catBar');
  bar.innerHTML=CATEGORIES.map((c,i)=>`<button class="cat-pill${i===currentCat?' active':''}" data-idx="${i}">${c.icon} ${c.name}</button>`).join('');
  document.getElementById('totalCategories').textContent=CATEGORIES.length-1;
}

function setupEvents(){
  // Category click
  document.getElementById('catBar').addEventListener('click',e=>{
    const pill=e.target.closest('.cat-pill');
    if(!pill)return;
    currentCat=+pill.dataset.idx;
    document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));
    pill.classList.add('active');
    switchCategory();
  });

  // Theme
  document.getElementById('themeToggle').addEventListener('click',()=>{
    isDark=!isDark;localStorage.setItem('phantom_dark',isDark);applyTheme();
  });

  // Favorites panel
  document.getElementById('favToggle').addEventListener('click',()=>{
    document.getElementById('favPanel').classList.toggle('open');
    renderFavPanel();
  });
  document.getElementById('favClose').addEventListener('click',()=>{
    document.getElementById('favPanel').classList.remove('open');
  });

  // Random
  document.getElementById('randomBtn').addEventListener('click',()=>{
    currentCat=Math.floor(Math.random()*(CATEGORIES.length-1))+1;
    document.querySelectorAll('.cat-pill').forEach(p=>p.classList.toggle('active',+p.dataset.idx===currentCat));
    switchCategory();
  });

  // Search
  document.getElementById('searchInput').addEventListener('input',e=>{
    searchQuery=e.target.value.toLowerCase();
    filterGallery();
  });

  // Lightbox
  document.getElementById('lbClose').addEventListener('click',closeLightbox);
  document.getElementById('lbPrev').addEventListener('click',()=>navLightbox(-1));
  document.getElementById('lbNext').addEventListener('click',()=>navLightbox(1));
  document.getElementById('lbDownload').addEventListener('click',downloadCurrent);
  document.getElementById('lbFav').addEventListener('click',toggleFavCurrent);
  document.getElementById('lbSlideshow').addEventListener('click',toggleSlideshow);
  document.getElementById('lightbox').addEventListener('click',e=>{
    if(e.target===document.getElementById('lightbox'))closeLightbox();
  });

  // Back to top
  document.getElementById('backTop').addEventListener('click',()=>{
    window.scrollTo({top:0,behavior:'smooth'});
  });

  // Keyboard
  document.addEventListener('keydown',handleKeyboard);

  // Scroll
  window.addEventListener('scroll',onScroll);

  // Infinite scroll
  window.addEventListener('scroll',()=>{
    if(isLoading)return;
    if(window.innerHeight+window.scrollY>=document.body.offsetHeight-LOAD_THRESHOLD){
      loadMore();
    }
  });
}

// ===== STARFIELD =====
function startStarfield(){
  const canvas=document.getElementById('starfield');
  const ctx=canvas.getContext('2d');
  let stars=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<120;i++){
    stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5+0.5,dx:(Math.random()-0.5)*0.3,dy:(Math.random()-0.5)*0.3,o:Math.random()*0.5+0.3});
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const style=getComputedStyle(document.documentElement);
    const col=style.getPropertyValue('--star-color').trim()||'rgba(217,119,87,0.6)';
    stars.forEach(s=>{
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=col;ctx.globalAlpha=s.o;ctx.fill();
      s.x+=s.dx;s.y+=s.dy;
      if(s.x<0||s.x>canvas.width)s.dx*=-1;
      if(s.y<0||s.y>canvas.height)s.dy*=-1;
    });
    ctx.globalAlpha=1;
    // Lines between nearby stars
    for(let i=0;i<stars.length;i++){
      for(let j=i+1;j<stars.length;j++){
        const d=Math.hypot(stars[i].x-stars[j].x,stars[i].y-stars[j].y);
        if(d<100){
          ctx.beginPath();ctx.moveTo(stars[i].x,stars[i].y);ctx.lineTo(stars[j].x,stars[j].y);
          ctx.strokeStyle=col;ctx.globalAlpha=(1-d/100)*0.15;ctx.stroke();
        }
      }
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
}

// ===== SCROLL =====
function onScroll(){
  // Progress bar
  const h=document.documentElement.scrollHeight-window.innerHeight;
  const pct=h>0?(window.scrollY/h)*100:0;
  document.getElementById('scrollProgress').style.width=pct+'%';
  // Back to top
  document.getElementById('backTop').classList.toggle('visible',window.scrollY>400);
}

// ===== INTERSECTION OBSERVER =====
function setupObserver(){
  observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  },{threshold:0.1});
}

// ===== IMAGE LOADING =====
function getImageUrl(api){
  // For redirect APIs, add cache-buster
  const sep=api.includes('?')?'&':'?';
  return api+sep+'_t='+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}

function loadImages(){
  isLoading=true;
  const gallery=document.getElementById('gallery');
  const loadingBar=document.getElementById('loadingBar');
  
  if(currentCat===0){
    // Load from all categories
    loadBatchFromAll();
  } else {
    const cat=CATEGORIES[currentCat];
    const promises=[];
    for(let i=0;i<BATCH_SIZE;i++){
      const apiUrl=cat.apis[i%cat.apis.length];
      promises.push(loadSingleImage(apiUrl,cat.name));
    }
    loadingBar.style.display='block';
    Promise.allSettled(promises).then(results=>{
      loadingBar.style.display='none';
      isLoading=false;
      results.forEach(r=>{
        if(r.status==='fulfilled'&&r.value){
          allImages.push(r.value);
          displayedImages.push(r.value);
          appendImage(r.value);
        }
      });
      updateCount();
    });
  }
}

function loadBatchFromAll(){
  const loadingBar=document.getElementById('loadingBar');
  loadingBar.style.display='block';
  const promises=[];
  // Pick random categories
  const cats=[...CATEGORIES].slice(1).sort(()=>Math.random()-0.5).slice(0,6);
  for(let i=0;i<BATCH_SIZE;i++){
    const cat=cats[i%cats.length];
    const apiUrl=cat.apis[Math.floor(Math.random()*cat.apis.length)];
    promises.push(loadSingleImage(apiUrl,cat.name));
  }
  Promise.allSettled(promises).then(results=>{
    loadingBar.style.display='none';
    isLoading=false;
    results.forEach(r=>{
      if(r.status==='fulfilled'&&r.value){
        allImages.push(r.value);
        displayedImages.push(r.value);
        appendImage(r.value);
      }
    });
    updateCount();
  });
}

function loadSingleImage(apiUrl,catName){
  return new Promise((resolve)=>{
    const url=getImageUrl(apiUrl);
    const img=new Image();
    // Do NOT set crossOrigin — these APIs don't send CORS headers
    const timer=setTimeout(()=>{img.src='';resolve(null)},12000);
    img.onload=function(){
      clearTimeout(timer);
      if(img.naturalWidth>50&&img.naturalHeight>50){
        resolve({url:img.src,cat:catName,id:Date.now()+'_'+Math.random().toString(36).slice(2,8),w:img.naturalWidth,h:img.naturalHeight});
      }else{resolve(null)}
    };
    img.onerror=function(){
      clearTimeout(timer);
      // Retry once with fresh URL
      const retryUrl=getImageUrl(apiUrl);
      const img2=new Image();
      const t2=setTimeout(()=>{img2.src='';resolve(null)},10000);
      img2.onload=function(){
        clearTimeout(t2);
        if(img2.naturalWidth>50){
          resolve({url:img2.src,cat:catName,id:Date.now()+'_'+Math.random().toString(36).slice(2,8),w:img2.naturalWidth,h:img2.naturalHeight});
        }else{resolve(null)}
      };
      img2.onerror=function(){clearTimeout(t2);resolve(null)};
      img2.src=retryUrl;
    };
    img.src=url;
  });
}

function appendImage(item){
  const gallery=document.getElementById('gallery');
  const div=document.createElement('div');
  div.className='item';
  div.dataset.id=item.id;
  div.dataset.cat=item.cat;
  div.dataset.url=item.url;
  const isFav=favorites.includes(item.url);
  div.innerHTML=`
    <img src="${item.url}" alt="${item.cat}" loading="lazy">
    <span class="cat-tag">${item.cat}</span>
    <div class="overlay">
      <div class="actions">
        <button class="dl-btn" title="下载">⬇</button>
        <button class="fav-btn${isFav?' fav-active':''}" title="收藏">${isFav?'♥':'♡'}</button>
      </div>
    </div>
  `;
  // Click to open lightbox
  div.addEventListener('click',e=>{
    if(e.target.closest('.fav-btn')){toggleFav(item.url,div.querySelector('.fav-btn'));return}
    if(e.target.closest('.dl-btn')){downloadImage(item.url);return}
    openLightbox(displayedImages.indexOf(item));
  });
  gallery.appendChild(div);
  observer.observe(div);
}

function loadMore(){
  if(isLoading)return;
  loadImages();
}

function switchCategory(){
  allImages=[];
  displayedImages=[];
  searchQuery='';
  document.getElementById('searchInput').value='';
  document.getElementById('gallery').innerHTML='';
  document.getElementById('currentCatLabel').textContent=currentCat===0?'全部分类':CATEGORIES[currentCat].icon+' '+CATEGORIES[currentCat].name;
  loadImages();
}

function filterGallery(){
  const items=document.querySelectorAll('.masonry .item');
  items.forEach(item=>{
    const cat=item.dataset.cat.toLowerCase();
    const match=searchQuery===''||cat.includes(searchQuery);
    item.style.display=match?'':'none';
  });
}

function updateCount(){
  const total=displayedImages.length;
  document.getElementById('galleryCount').textContent=`显示 ${total} 张图片`;
  document.getElementById('totalLoaded').textContent=allImages.length;
}

// ===== LIGHTBOX =====
function openLightbox(idx){
  lightboxIndex=idx;
  const item=displayedImages[idx];
  if(!item)return;
  const lb=document.getElementById('lightbox');
  document.getElementById('lbImg').src=item.url;
  document.getElementById('lbCounter').textContent=`${idx+1} / ${displayedImages.length}`;
  document.getElementById('lbCat').textContent=item.cat;
  updateLbFavBtn();
  lb.classList.add('active');
  document.body.style.overflow='hidden';
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow='';
  stopSlideshow();
}

function navLightbox(dir){
  if(displayedImages.length===0)return;
  lightboxIndex=(lightboxIndex+dir+displayedImages.length)%displayedImages.length;
  const item=displayedImages[lightboxIndex];
  document.getElementById('lbImg').src=item.url;
  document.getElementById('lbCounter').textContent=`${lightboxIndex+1} / ${displayedImages.length}`;
  document.getElementById('lbCat').textContent=item.cat;
  updateLbFavBtn();
}

function downloadCurrent(){
  if(lightboxIndex<0)return;
  downloadImage(displayedImages[lightboxIndex].url);
}

function toggleFavCurrent(){
  if(lightboxIndex<0)return;
  const url=displayedImages[lightboxIndex].url;
  toggleFav(url,document.getElementById('lbFav'));
  updateLbFavBtn();
  // Update gallery button too
  const item=document.querySelector(`.masonry .item[data-url="${CSS.escape(url)}"] .fav-btn`);
  if(item){
    const isFav=favorites.includes(url);
    item.classList.toggle('fav-active',isFav);
    item.textContent=isFav?'♥':'♡';
  }
}

function updateLbFavBtn(){
  if(lightboxIndex<0)return;
  const url=displayedImages[lightboxIndex].url;
  const isFav=favorites.includes(url);
  const btn=document.getElementById('lbFav');
  btn.innerHTML=isFav?'♥ 已收藏':'♡ 收藏';
}

// ===== FAVORITES =====
function toggleFav(url,btnEl){
  const idx=favorites.indexOf(url);
  if(idx>=0){favorites.splice(idx,1)}
  else{favorites.push(url)}
  localStorage.setItem('phantom_favs',JSON.stringify(favorites));
  if(btnEl){
    const isFav=favorites.includes(url);
    btnEl.classList.toggle('fav-active',isFav);
    if(btnEl.textContent!==undefined)btnEl.textContent=isFav?'♥':'♡';
  }
  updateFavCount();
}

function updateFavCount(){
  document.getElementById('favCount').textContent=favorites.length;
}

function renderFavPanel(){
  const grid=document.getElementById('favGrid');
  if(favorites.length===0){
    grid.innerHTML='<div class="fav-empty">还没有收藏的图片<br>点击图片上的 ♡ 收藏</div>';
    return;
  }
  grid.innerHTML=favorites.map((url,i)=>`
    <div class="fav-item">
      <img src="${url}" alt="收藏 ${i+1}" loading="lazy">
      <button class="fav-remove" data-url="${url}">✕</button>
    </div>
  `).join('');
  grid.querySelectorAll('.fav-remove').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const url=btn.dataset.url;
      favorites=favorites.filter(u=>u!==url);
      localStorage.setItem('phantom_favs',JSON.stringify(favorites));
      renderFavPanel();
      updateFavCount();
    });
  });
  grid.querySelectorAll('.fav-item').forEach((item,i)=>{
    item.addEventListener('click',()=>{
      // Open in lightbox
      const url=favorites[i];
      const idx=displayedImages.findIndex(img=>img.url===url);
      if(idx>=0)openLightbox(idx);
      else window.open(url,'_blank');
    });
  });
}

// ===== DOWNLOAD =====
function downloadImage(url){
  // Try fetch first (works if CORS allows), otherwise open in new tab
  fetch(url).then(r=>{
    if(!r.ok)throw new Error('fetch failed');
    return r.blob();
  }).then(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='phantom-'+Date.now()+'.jpg';
    a.click();
    URL.revokeObjectURL(a.href);
  }).catch(()=>{
    // Fallback: open in new tab for manual save
    window.open(url,'_blank');
  });
}

// ===== SLIDESHOW =====
function toggleSlideshow(){
  if(slideshowTimer){stopSlideshow();return}
  document.getElementById('slideshowBadge').classList.add('active');
  document.getElementById('lbSlideshow').innerHTML='⏸ 暂停';
  slideshowTimer=setInterval(()=>{
    navLightbox(1);
  },3000);
}

function stopSlideshow(){
  if(!slideshowTimer)return;
  clearInterval(slideshowTimer);
  slideshowTimer=null;
  document.getElementById('slideshowBadge').classList.remove('active');
  document.getElementById('lbSlideshow').innerHTML='▶ 幻灯片';
}

// ===== KEYBOARD =====
function handleKeyboard(e){
  const lb=document.getElementById('lightbox');
  if(!lb.classList.contains('active')){
    return;
  }
  switch(e.key){
    case 'Escape':closeLightbox();break;
    case 'ArrowLeft':navLightbox(-1);break;
    case 'ArrowRight':navLightbox(1);break;
    case ' ':e.preventDefault();toggleSlideshow();break;
    case 'd':case 'D':downloadCurrent();break;
  }
}

// ===== GO =====
document.addEventListener('DOMContentLoaded',init);
</script>
