<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兴趣标签</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #faf9f7 0%, #f5f0ec 100%);
            perspective: 1000px;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .cube {
            width: 180px;
            height: 180px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 12s infinite ease-in-out;
        }

        @keyframes rotate {
            0%   { transform: rotateX(0deg) rotateY(0deg); }
            25%  { transform: rotateX(90deg) rotateY(90deg); }
            50%  { transform: rotateX(180deg) rotateY(180deg); }
            75%  { transform: rotateX(270deg) rotateY(270deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .face {
            position: absolute;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #d97757;
            border: 2px solid rgba(217,119,87,0.3);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(217,119,87,0.1);
            text-shadow: 0 0 20px rgba(217,119,87,0.2);
            transition: background 0.3s;
        }

        .face:hover {
            background: rgba(217,119,87,0.1);
        }

        .front  { transform: translateZ(90px); }
        .back   { transform: rotateY(180deg) translateZ(90px); }
        .right  { transform: rotateY(90deg) translateZ(90px); }
        .left   { transform: rotateY(-90deg) translateZ(90px); }
        .top    { transform: rotateX(90deg) translateZ(90px); }
        .bottom { transform: rotateX(-90deg) translateZ(90px); }

        /* Ambient particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(217,119,87,0.3);
            animation: float 8s ease-in-out infinite;
        }
        .particle:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 70%; left: 80%; animation-delay: -2s; width: 10px; height: 10px; }
        .particle:nth-child(3) { top: 30%; left: 85%; animation-delay: -4s; width: 4px; height: 4px; }
        .particle:nth-child(4) { top: 80%; left: 15%; animation-delay: -6s; width: 8px; height: 8px; }
        .particle:nth-child(5) { top: 50%; left: 50%; animation-delay: -3s; width: 5px; height: 5px; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-30px) translateX(20px); opacity: 0.6; }
            50% { transform: translateY(-10px) translateX(-15px); opacity: 0.4; }
            75% { transform: translateY(-40px) translateX(10px); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="cube">
        <div class="face front"> 漫画</div>
        <div class="face back"> 游戏</div>
        <div class="face right"> 代码</div>
        <div class="face left"> 跑步</div>
        <div class="face top"> 骑行</div>
        <div class="face bottom"> 动漫</div>
    </div>
</body>
</html>
