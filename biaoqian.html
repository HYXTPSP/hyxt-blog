<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a40;
            background-image: radial-gradient(circle, #a855f7 1px, transparent 1px);
            background-size: 30px 30px;
            perspective: 1000px;
            margin: 0;
            overflow: hidden;
        }

        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 10s infinite linear;
            border: none;
            box-shadow: none;
            border-radius: 0;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            font-weight: bold;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            box-sizing: border-box;
            background-color: #42067b;
            text-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotate {
            0%   { transform: rotateX(0) rotateY(0) rotateZ(0); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }
    </style>
</head>
<body>
    <div class="cube">
        <div class="face front">漫画</div>
        <div class="face back">游戏</div>
        <div class="face right">代码</div>
        <div class="face left">跑步</div>
        <div class="face top">骑行</div>
        <div class="face bottom">动漫</div>
    </div>
</body>
</html>
